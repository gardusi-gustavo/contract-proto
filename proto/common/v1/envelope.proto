syntax = "proto3";

package gardusi.common.v1;

message Envelope {
  string id = 1;
  string type = 2;
  string version = 3;
  bytes payload = 4;
}

message Error {
  string code = 1;
  string message = 2;
  map<string, string> details = 3;
}

message PageRequest {
  int32 page_size = 1;
  string page_token = 2;
}

message PageResponse {
  string next_page_token = 1;
  int32 total_size = 2;
}
